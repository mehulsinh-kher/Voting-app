kind: Deployment
apiVersion: apps/v1

metadata:
  name: postgre-deployment
  namespace: voting-app
  labels:
    app: postgre-label

spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgre-label
  
  template:
    metadata:
      labels:
        app: postgre-label

    spec:
      containers:
      - name: postgre
        image: postgres:9.4
        env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: voting-app-config
              key: POSTGRES_USER
            
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: voting-app-secret
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 5432
