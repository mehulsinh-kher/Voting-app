kind: Deployment
apiVersion: apps/v1

metadata:
  name: tests-deployment
  namespace: voting-app
  labels:
    app: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test
  
  template:
    metadata:
      labels:
        app: test

    spec:
      containers:
      - name: test
        image: mehulkher/voting-app:tests
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: test
  name: tests-service
  namespace: voting-app
spec:
  type: NodePort
  ports:
  - name: "tests-service"
    port: 80
    targetPort: 80
    nodePort: 30085