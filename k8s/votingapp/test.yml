kind: Deployment
apiVersion: apps/v1

metadata:
  name: tests-deployment
  namespace: voting-app
  labels:
    app: voting-app-label

spec:
  replicas: 2
  selector:
    matchLabels:
      app: voting-app-label
  
  template:
    metadata:
      labels:
        app: voting-app-label

    spec:
      containers:
      - name: voting-app
        image: mehulkher/voting-app:tests
        ports:
        - containerPort: 80
