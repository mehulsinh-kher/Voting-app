kind: Deployment
apiVersion: apps/v1

metadata:
  name: result-deployment
  namespace: voting-app
  labels:
    app: result

spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  
  template:
    metadata:
      labels:
        app: result

    spec:
      containers:
      - name: result
        image: mehulkher/voting-app:result
        ports:
        - containerPort: 4000

---
kind: Service
apiVersion: v1

metadata:
  name: result-service
  namespace: voting-app

spec:
  type: NodePort
  selector:
    app: result
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30081
      protocol: TCP