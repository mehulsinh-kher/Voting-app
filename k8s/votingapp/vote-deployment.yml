kind: Deployment
apiVersion: apps/v1

metadata:
  name: vote-app-deployment
  namespace: voting-app
  labels:
    app: voting-app-label

spec:
  replicas: 1
  selector:
    matchLabels:
      app: voting-app-label
  
  template:
    metadata:
      labels:
        app: voting-app-label

    spec:
      containers:
      - name: voting-app
        image: mehulkher/voting-app:vote
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: vote-service
  labels:
        app: voting-app-label
  namespace: voting-app
spec:
  type: NodePort
  selector:
    app: voting-app-label
  ports:
  - port: 80
    targetPort: 80
    nodePort: 31000
    protocol: TCP

